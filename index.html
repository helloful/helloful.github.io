<!doctype html>
<html>
	<head>
		<meta charset="utf-8"/>
		<meta name="keywords" content=""/>
		<meta name="description" content=""/>
		<title>520</title>
		<style>
			*{margin:0;padding:0;}
			 body{background:url("2024/3.jpg") ;background-size:cover;}
			/*start top*/
			.top{width:400px;height:100px;margin:60px auto;font-size:30px;font-family:"华文行楷";color:#fff;}
			/*end top*/
			/*start box*/
			.box{width:410px;height:410px;margin:auto;perspective:800px;/*景深*/}
			.box .pic{gap:10px;position:relative;transform-style:preserve-3d;/*3d环境*/ animation:play 10s linear infinite;/*动画名称 执行时间 匀速 无限执行*/}
			.text{font-size:30px;font-family:"华文行楷";color:#fff}
			.box ul li{list-style:none;position:absolute;top:0;left:0;}
			/*start box*/
			/*定义一个关键帧*/
			@keyframes play{
				from{transform:rotateY(0deg);}
				to{transform:rotateY(360deg);}
			}
            ul {
                transform-style:preserve-3d;
            }
			/*start text*/
			#text{width:500px;height:200px;color:#6fade1;margin:auto;font-size:24px;font-family:"方正喵呜体";}
			/*end text*/
		</style>
	</head>
	<body onclick="play()">
		<!--start top-->
		<div class="top" onclick="play()">
			<marquee behavior="scroll">老婆，一缕烟火，两抹红尘，三生有幸，遇见你。</marquee>
		
		</div>
		<button >下一页</button>
		<audio src="gushi.mp3" loop="loop" id="music" hidden autoplay></audio>
		<!--end top-->
		<!--start box-->
		<div class="box" onclick="play()">
			<div class="pic">
				<ul>
					<li><img src="2024/1.jpg" width="160" height="200" alt=""/></li>
					<li><img src="2024/2.jpg" width="160" height="200" alt=""/></li>
					<li><img src="2024/3.jpg" width="160" height="200" alt=""/></li>
					<li><img src="2024/4.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/5.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/6.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/7.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/8.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/9.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/10.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/11.jpg" width="160" height="200" alt="" /></li>
					<li><img src="2024/12.jpg" width="160" height="200" alt="" /></li>
				</ul>
			</div>
		</div>
		<!--end box-->
		<!--start text-->
		<div id="text" style="color: #fff;font-size:30px;font-family:华文行楷;margin-top: 30px;" onclick="play()"></div>
		<!--end text-->
		<!-- <embed src="music.mp3" hidden="true" loop="-1" width="0" height="0"/>
		<embed src="music.ogg" hidden="true" loop="-1" width="0" height="0"/>
		<embed src="music.wav" hidden="true" loop="-1" width="0" height="0"/> -->
		
		<audio src="gushi.mp3" loop="loop" id="music" hidden controls></audio>
        <script src="js/jquery.js"></script>
		<!--雪花-->
		<script src="js/snow.js"></script>
		<script>
			function play(params) {
				let audio = document.getElementById("music");
				audio.play();
				
			}
			var idx=0
			$(".pic ul li").each(function(i){//遍历
				var deg=360/$(".pic ul li").size();//size个数
				//当前的li对象 添加css样式
		
				$(this).css({"transform":"rotateY("+deg*i+"deg) translateZ(300px)"});
				
				$.fn.snow({
					minSize:0,
					maxSize:0,
					newOn:500,
					flakeColor:"#ffffff"
				});
				
			});
			var i=0;
			var str="走过千山万水，才懂得家最温馨;历经风风雨雨，才感悟平淡最真;错过许许多多，才知道珍惜拥有;路过熙熙攘攘，才明白你最珍贵。人间烟火，山河远阔。无一是你，无一不是你。";
			
			window.onload=function typing(){
				//获取div
				var mydiv=document.getElementById("text");
				mydiv.innerHTML+=str.charAt(i);
				i++;
				var id=setTimeout(typing,100);
				if(i==str.length){
					clearTimeout(id);
				}
			}
		</script>
	</body>
</html>
