<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>520 - 遇见你，是我最美的意外</title>
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink: #ffb3c6;
            --pink-mid: #ff7b9c;
            --pink-deep: #e85d84;
            --rose: #d9446a;
            --white: #ffffff;
            --gold: #f4d5c7;
            --text-dark: #4a3040;
            --text-mid: #6b4b5e;
            --shadow-soft: 0 8px 32px rgba(217, 68, 106, 0.12);
            --shadow-card: 0 12px 40px rgba(180, 60, 90, 0.15);
            --shadow-hover: 0 20px 50px rgba(200, 60, 100, 0.22);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-blur: blur(18px);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.25, 0.1, 0.25, 1.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'STHeiti', sans-serif;
            background: linear-gradient(160deg, #fce4ec 0%, #fce0e6 15%, #fdf2f5 30%, #fff5f6 45%, #fef0f4 60%, #fde8ed 75%, #fce4ec 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp linear forwards;
            opacity: 0;
            filter: blur(0.5px);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            5% {
                opacity: 0.85;
            }
            40% {
                opacity: 0.7;
            }
            70% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-105vh) translateX(80px) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        @keyframes floatUpAlt {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.3);
                opacity: 0;
            }
            8% {
                opacity: 0.8;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-110vh) translateX(-60px) rotate(-320deg) scale(1.1);
                opacity: 0;
            }
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .hero-section {
            text-align: center;
            padding: 40px 20px 25px;
            position: relative;
        }

        .hero-icon {
            font-size: 60px;
            display: inline-block;
            animation: heartbeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(220, 60, 100, 0.35));
            cursor: default;
            user-select: none;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            8% {
                transform: scale(1.18);
            }
            16% {
                transform: scale(1.04);
            }
            24% {
                transform: scale(1.16);
            }
            34% {
                transform: scale(1);
            }
        }

        .hero-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            margin-top: 10px;
            background: linear-gradient(135deg, #e85d84, #d9446a, #c0395b, #e85d84);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            line-height: 1.3;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #b87080;
            margin-top: 6px;
            letter-spacing: 0.08em;
            font-weight: 400;
            opacity: 0.8;
        }

        .time-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            text-align: center;
            margin: 20px 0 28px;
            box-shadow: var(--shadow-card);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .time-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 150, 180, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 30%, rgba(255, 180, 200, 0.06) 0%, transparent 55%);
            pointer-events: none;
            animation: shimmer 8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(2%, -1%);
            }
            66% {
                transform: translate(-1%, 2%);
            }
        }

        .time-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
        }

        .time-label {
            font-size: 0.95rem;
            color: #b88090;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .time-label .icon-sparkle {
            display: inline-block;
            animation: twinkle 1.5s ease-in-out infinite;
        }
        .time-label .icon-sparkle:nth-child(1) {
            animation-delay: 0s;
        }
        .time-label .icon-sparkle:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .time-display {
            font-size: clamp(1.3rem, 3vw, 1.9rem);
            font-weight: 800;
            color: #d9446a;
            letter-spacing: 0.03em;
            position: relative;
            z-index: 1;
            line-height: 1.5;
        }

        .time-display .time-number {
            display: inline-block;
            background: linear-gradient(180deg, #fff5f7 0%, #ffe8ee 100%);
            border-radius: 10px;
            padding: 4px 10px;
            margin: 0 2px;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
            font-weight: 700;
            color: #c0395b;
            box-shadow: inset 0 1px 3px rgba(180, 60, 90, 0.08);
            min-width: 32px;
            text-align: center;
        }

        .time-unit {
            font-size: 0.75em;
            font-weight: 500;
            color: #b87080;
            margin: 0 2px;
        }

        .section-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #c0395b;
            letter-spacing: 0.05em;
            margin: 32px 0 16px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #e85d84, #f4a5b8, #e85d84);
            border-radius: 10px;
            margin: 8px auto 0;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 8px 0 20px;
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .gallery-item {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition);
            aspect-ratio: 4 / 3;
            background: #fce4ec;
            group: true;
        }

        .gallery-item:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px) scale(1.02);
            z-index: 2;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            transform: translateY(100%);
            transition: transform 0.4s ease;
            pointer-events: none;
        }

        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 14px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.35s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            z-index: 10000;
            opacity: 0.7;
            transition: opacity 0.3s;
            user-select: none;
            line-height: 1;
        }
        .lightbox-close:hover {
            opacity: 1;
        }

        .video-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin: 20px 0;
            box-shadow: var(--shadow-card);
            transition: all var(--transition);
            text-align: center;
        }

        .video-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .video-wrapper {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background: #1a1a1a;
            aspect-ratio: 16 / 9;
            max-width: 100%;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: var(--radius-md);
            background: #000;
        }

        .video-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1rem;
            opacity: 0.7;
            pointer-events: none;
            text-align: center;
        }

        .video-hint {
            font-size: 0.8rem;
            color: #b88090;
            margin-top: 10px;
            letter-spacing: 0.03em;
        }

        .music-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            margin: 20px 0;
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .music-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .music-card.playing {
            border-color: #f4a5b8;
            box-shadow: 0 12px 40px rgba(217, 68, 106, 0.22);
        }

        .music-card.playing::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-lg);
            border: 2px solid transparent;
            background: linear-gradient(45deg, #e85d84, #f4a5b8, #e85d84, #f4a5b8) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: borderGlow 2.5s linear infinite;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }

        .music-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e85d84, #d9446a);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 22px rgba(217, 68, 106, 0.35);
            transition: all var(--transition);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .music-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(217, 68, 106, 0.5);
        }
        .music-btn:active {
            transform: scale(0.94);
            transition: 0.15s ease;
        }

        .music-btn.playing-state {
            background: linear-gradient(135deg, #c0395b, #a8324e);
            animation: pulseBtn 1.6s ease-in-out infinite;
        }

        @keyframes pulseBtn {
            0%,
            100% {
                box-shadow: 0 6px 22px rgba(217, 68, 106, 0.35);
            }
            50% {
                box-shadow: 0 8px 35px rgba(217, 68, 106, 0.65);
            }
        }

        .music-info {
            flex: 1;
            min-width: 150px;
            position: relative;
            z-index: 1;
        }
        .music-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #4a3040;
            letter-spacing: 0.03em;
        }
        .music-artist {
            font-size: 0.82rem;
            color: #b88090;
            margin-top: 2px;
        }

        .music-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 28px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .music-wave .bar {
            width: 4px;
            border-radius: 3px;
            background: #e85d84;
            transition: height 0.25s ease;
            height: 6px;
        }
        .music-card.playing .music-wave .bar {
            animation: waveAnim 0.9s ease-in-out infinite;
        }
        .music-card.playing .music-wave .bar:nth-child(1) {
            animation-delay: 0s;
        }
        .music-card.playing .music-wave .bar:nth-child(2) {
            animation-delay: 0.12s;
        }
        .music-card.playing .music-wave .bar:nth-child(3) {
            animation-delay: 0.24s;
        }
        .music-card.playing .music-wave .bar:nth-child(4) {
            animation-delay: 0.36s;
        }
        .music-card.playing .music-wave .bar:nth-child(5) {
            animation-delay: 0.48s;
        }
        .music-card.playing .music-wave .bar:nth-child(6) {
            animation-delay: 0.6s;
        }

        @keyframes waveAnim {
            0%,
            100% {
                height: 6px;
            }
            30% {
                height: 22px;
            }
            60% {
                height: 10px;
            }
            85% {
                height: 26px;
            }
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .volume-icon {
            font-size: 1.1rem;
            cursor: pointer;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .volume-icon:hover {
            opacity: 1;
        }
        .volume-slider {
            -webkit-appearance: none;
            width: 70px;
            height: 5px;
            border-radius: 10px;
            background: #f0d0d8;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e85d84;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(200, 60, 100, 0.3);
        }

        @media (max-width: 500px) {
            .music-card {
                gap: 10px;
                padding: 16px;
            }
            .volume-slider {
                width: 45px;
            }
            .music-wave {
                gap: 2px;
                height: 22px;
            }
            .music-wave .bar {
                width: 3px;
            }
        }

        .love-letter {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 30px 26px;
            margin: 24px 0;
            box-shadow: var(--shadow-card);
            text-align: center;
            transition: all var(--transition);
            position: relative;
        }

        .love-letter:hover {
            box-shadow: var(--shadow-hover);
        }

        .love-letter .quote-mark {
            font-size: 3rem;
            color: #e85d84;
            opacity: 0.45;
            line-height: 1;
            user-select: none;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .love-letter .message {
            font-size: 1.1rem;
            line-height: 2;
            color: #5a3a48;
            letter-spacing: 0.04em;
            font-weight: 400;
            padding: 8px 0;
            max-width: 550px;
            margin: 0 auto;
        }

        .love-letter .signature {
            margin-top: 16px;
            font-size: 1rem;
            color: #c0395b;
            font-weight: 600;
            letter-spacing: 0.06em;
        }

        .footer-note {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #c0a0a8;
            letter-spacing: 0.04em;
        }

        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            font-size: 28px;
            animation: clickHeartAnim 1s ease-out forwards;
        }
        @keyframes clickHeartAnim {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 1;
            }
            40% {
                transform: translate(-50%, -120%) scale(1.3);
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -280%) scale(0.2);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .hero-icon {
                font-size: 44px;
            }
            .hero-title {
                font-size: 1.7rem;
            }
            .time-display {
                font-size: 1.1rem;
            }
            .time-display .time-number {
                padding: 3px 7px;
                border-radius: 7px;
                min-width: 24px;
            }
            .love-letter .message {
                font-size: 1rem;
                line-height: 1.8;
            }
            .gallery-item {
                aspect-ratio: 3 / 2;
            }
        }

        @media (max-width: 400px) {
            .main-container {
                padding: 15px 10px 40px;
            }
            .time-card {
                padding: 18px 12px;
            }
            .music-card {
                flex-wrap: wrap;
                justify-content: center;
            }
            .volume-control {
                width: 100%;
                justify-content: center;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <div id="particles-container"></div>

    <div class="main-container" onclick="document.getElementById('bgMusic').play()">

        <section class="hero-section">
            <div class="hero-icon">💖</div>
            <h1 class="hero-title">遇 见 你</h1>
            <p class="hero-subtitle">✦ 是时光里最温柔的故事 ✦</p>
        </section>

        <div class="time-card" id="timeCard">
            <div class="time-label">
                <span class="icon-sparkle">✨</span> 我们在一起 <span class="icon-sparkle">✨</span>
            </div>
            <div class="time-display" id="timeDisplay">
                加载中...
            </div>
            <div style="font-size:0.78rem;color:#c0909a;margin-top:6px;letter-spacing:0.03em;">
                始于 <strong id="startDateLabel">2022年6月16日</strong>
            </div>
        </div>

        <div class="section-title">📷 2026我们的瞬间</div>
        <div class="gallery-grid" id="galleryGrid">
            <div class="gallery-item" data-src="https://picsum.photos/seed/love520/800/600">
                <img src="./images/1.jpg"
                alt="甜蜜瞬间"
                loading="lazy"
                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%23fce4ec%22 width=%22400%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23d9446a%22 font-size=%2218%22>💕 甜蜜瞬间</text></svg>';">
                <div class="gallery-overlay">💕 甜蜜瞬间</div>
            </div>
            <div class="gallery-item" data-src="https://picsum.photos/seed/romantic520/800/600">
                <img src="./images/2.JPG"
                alt="浪漫时光"
                loading="lazy"

        <div class="quote-mark">“</div>
        <p class="message">
            在茫茫人海中遇见你，<br>

            因为有你而变得闪闪发光。<br>
            愿时光能缓，愿我们不散，<br>
            愿未来的每一天，<br>
            都有你陪伴在身旁。<br>
            <strong>520，我爱你。</strong>

        <div class="quote-mark" style="transform:rotate(180deg);">“</div>

    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="放大查看" id="lightboxImg">
</div>

<script>
    (function() {
        // ==================== 相识时间配置 ====================
        // 修改下面的日期为你和TA相识的日期
        const START_DATE = new Date('2022-06-16T00:00:00');

        const startDateLabel = document.getElementById('startDateLabel');
        const timeDisplay = document.getElementById('timeDisplay');

        const year = START_DATE.getFullYear();
        const month = START_DATE.getMonth() + 1;
        const day = START_DATE.getDate();
        startDateLabel.textContent = `${year}年${month}月${day}日`;

        function updateTimer() {
            const now = new Date();
            let diffMs = now - START_DATE;
            if (diffMs < 0) {
                timeDisplay.innerHTML = '<span style="color:#b88090;">时间设定在未来呢~ 💫</span>';
                return;
            }

            const totalSeconds = Math.floor(diffMs / 1000);
            const totalMinutes = Math.floor(totalSeconds / 60);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalDays = Math.floor(totalHours / 24);

            // 计算年、月、日
            let tempDate = new Date(START_DATE);
            let years = 0;
            let months = 0;
            while (true) {
                let nextMonth = new Date(tempDate);
                nextMonth.setMonth(nextMonth.getMonth() + 1);
                if (nextMonth <= now) {
                    months++;
                    tempDate = nextMonth;
                } else {
                    break;
                }
            }
            if (months >= 12) {
                years = Math.floor(months / 12);
                months = months % 12;
            }
            const days = Math.floor((now - tempDate) / (1000 * 60 * 60 * 24));

            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            timeDisplay.innerHTML = `
                <span class="time-number">${years}</span><span class="time-unit">年</span>
                <span class="time-number">${months}</span><span class="time-unit">月</span>
                <span class="time-number">${days}</span><span class="time-unit">天</span>
                <span class="time-number">${String(hours).padStart(2, '0')}</span><span class="time-unit">时</span>
                <span class="time-number">${String(minutes).padStart(2, '0')}</span><span class="time-unit">分</span>
                <span class="time-number">${String(seconds).padStart(2, '0')}</span><span class="time-unit">秒</span>
            `;
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // ==================== 粒子特效 ====================
        const particlesContainer = document.getElementById('particles-container');
        const particleEmojis = ['🌸', '💕', '✨', '🩷', '💖', '🌷', '💗', '🦋', '💝', '🍃', '💐', '❀', '♥', '🕊️'];

        function createParticle() {
            const particle = document.createElement('span');
            particle.className = 'particle';
            particle.textContent = particleEmojis[Math.floor(Math.random() * particleEmojis.length)];
            particle.style.left = Math.random() * 95 + '%';
            particle.style.bottom = '-50px';
            particle.style.fontSize = (Math.random() * 22 + 12) + 'px';
            particle.style.animationDuration = (Math.random() * 8 + 7) + 's';
            particle.style.animationName = Math.random() > 0.5 ? 'floatUp' : 'floatUpAlt';
            particlesContainer.appendChild(particle);

            const duration = parseFloat(particle.style.animationDuration) * 1000;
            setTimeout(() => {
                if (particle.parentNode) particle.remove();
            }, duration + 500);
        }

        for (let i = 0; i < 18; i++) {
            setTimeout(() => createParticle(), i * 350);
        }
        setInterval(() => {
            if (particlesContainer.children.length < 35) {
                createParticle();
            }
        }, 1200);

        // ==================== 图片灯箱 ====================
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');
        const galleryItems = document.querySelectorAll('.gallery-item');

        galleryItems.forEach(item => {
            item.addEventListener('click', function(e) {
                const src = this.getAttribute('data-src');
                if (src) {
                    lightboxImg.src = src;
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            lightboxImg.src = '';
        }
        lightboxClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
        });

        // ==================== 音乐自动播放增强 ====================
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicCard = document.getElementById('musicCard');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.getElementById('volumeIcon');

        let isPlaying = false;
        let isMutedForAutoplay = false; // 标记是否因自动播放策略被静音
        let targetVolume = parseFloat(volumeSlider.value);
        bgMusic.volume = targetVolume;

        function updateMusicUI() {
            if (isPlaying) {
                musicBtn.textContent = '⏸';
                musicBtn.classList.add('playing-state');
                musicCard.classList.add('playing');
            } else {
                musicBtn.textContent = '▶';
                musicBtn.classList.remove('playing-state');
                musicCard.classList.remove('playing');
            }
            // 波形动画由CSS根据.playing类控制
        }

        // 尝试自动播放：先正常播放，若失败则静音播放并等待用户交互恢复声音
        async function initAutoPlay() {
            try {
                await bgMusic.play();
                isPlaying = true;
                isMutedForAutoplay = false;
                updateMusicUI();
            } catch (err) {
                // 自动播放被阻止，尝试静音播放
                console.log('自动播放被阻止，切换为静音播放，点击页面任意位置恢复声音');
                bgMusic.muted = true;
                isMutedForAutoplay = true;
                try {
                    await bgMusic.play();
                    isPlaying = true;
                    updateMusicUI();
                } catch (e) {
                    console.log('静音播放也失败，等待用户手动播放');
                    isPlaying = false;
                    updateMusicUI();
                }
            }
        }

        // 用户首次交互后解除静音
        function handleFirstInteraction() {
            if (isMutedForAutoplay && bgMusic.muted) {
                bgMusic.muted = false;
                bgMusic.volume = targetVolume;
                isMutedForAutoplay = false;
                console.log('已恢复声音');
            }
            // 如果音乐未在播放，尝试播放（以防之前完全没启动）
            if (!isPlaying && bgMusic.paused) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    updateMusicUI();
                }).catch(() => {});
            }
        }

        // 绑定首次交互事件
        const interactionEvents = ['click', 'touchstart', 'scroll'];
        interactionEvents.forEach(evt => {
            document.addEventListener(evt, handleFirstInteraction, { once: false, passive: true });
        });
        // 当用户手动点击播放按钮时，也视为一次交互
        musicBtn.addEventListener('click', () => {
            handleFirstInteraction();
            // 下面的toggle逻辑会处理播放/暂停
        });

        // 音乐播放/暂停按钮
        musicBtn.addEventListener('click', function toggleMusic() {
            // 如果当前是静音自动播放状态，先解除静音
            if (isMutedForAutoplay) {
                bgMusic.muted = false;
                bgMusic.volume = targetVolume;
                isMutedForAutoplay = false;
            }

            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    updateMusicUI();
                }).catch(err => {
                    console.log('播放失败:', err);
                    isPlaying = false;
                    updateMusicUI();
                });
            }
            updateMusicUI();
        });

        // 音量控制
        volumeSlider.addEventListener('input', function() {
            targetVolume = parseFloat(this.value);
            if (!isMutedForAutoplay) {
                bgMusic.volume = targetVolume;
            }
            if (targetVolume === 0) volumeIcon.textContent = '🔇';
            else if (targetVolume < 0.4) volumeIcon.textContent = '🔈';
            else if (targetVolume < 0.75) volumeIcon.textContent = '🔉';
            else volumeIcon.textContent = '🔊';
        });

        volumeIcon.addEventListener('click', function() {
            if (targetVolume > 0) {
                bgMusic.dataset.prevVolume = targetVolume;
                targetVolume = 0;
                volumeSlider.value = 0;
                if (!isMutedForAutoplay) bgMusic.volume = 0;
                volumeIcon.textContent = '🔇';
            } else {
                const prev = parseFloat(bgMusic.dataset.prevVolume || '0.6');
                targetVolume = prev;
                volumeSlider.value = prev;
                if (!isMutedForAutoplay) bgMusic.volume = prev;
                volumeIcon.textContent = prev < 0.4 ? '🔈' : prev < 0.75 ? '🔉' : '🔊';
            }
        });

        // 启动自动播放流程
        document.addEventListener('DOMContentLoaded', () => {
            initAutoPlay();
        });

        // ==================== 点击爱心特效 ====================
        document.addEventListener('click', function(e) {
            if (e.target.closest('.lightbox') ||
                e.target.closest('button') ||
                e.target.closest('input') ||
                e.target.closest('video') ||
                e.target.closest('.gallery-item') ||
                e.target.closest('#lightboxClose')) {
                return;
            }

            const heart = document.createElement('span');
            heart.className = 'click-heart';
            heart.textContent = ['💕', '💖', '💗', '💝', '✨', '🩷'][Math.floor(Math.random() * 6)];
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            heart.style.fontSize = (Math.random() * 24 + 20) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, 1100);
        });

        // 时间卡片点击动画
        const timeCard = document.getElementById('timeCard');
        timeCard.addEventListener('click', function(e) {
            this.style.transform = 'scale(0.97)';
            setTimeout(() => {
                this.style.transform = '';
            }, 200);
        });
    })();
</script>
